# =============================================================================
# build.yml - GitHub Actions: builds, tests and validates the plug-in on every push.
#
# Two jobs run in parallel:
#   macos   - Universal Binary (Apple Silicon + Intel): VST3, AU and Standalone
#   windows - x64: VST3 and Standalone
#
# Each job: configure -> build -> unit tests -> validate in a plug-in checker
# -> zip -> upload. The zips appear as downloadable "artifacts" on the run's page
# (Actions tab -> pick a run -> Artifacts).
#
# Validators:
#   auval      - Apple's own Audio Unit validator (Logic uses the same checks)
#   pluginval  - Tracktion's open-source validator; strictness 10 is its most
#                thorough level (state save/restore, threading, parameter fuzzing)
# =============================================================================

name: Build

# When to run: pushes to main or any dolio/* branch, pull requests, or the
# "Run workflow" button on the Actions tab.
on:
  push:
    branches: [main, "dolio/**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4                   # pinned so results don't change unexpectedly
  ARTEFACTS: build/SliceAble_artefacts/Release # where CMake puts the built plug-ins

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Ninja builds faster than the Xcode generator.
      - name: Install Ninja
        run: brew install ninja

      # Both architectures are requested explicitly (CMakeLists.txt also defaults to this on macOS).
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Fails the build if any binary is missing either architecture.
      - name: Check binaries are universal (arm64 + x86_64)
        run: |
          set -euo pipefail
          for bin in \
            "$ARTEFACTS/VST3/Slice-able.vst3/Contents/MacOS/Slice-able" \
            "$ARTEFACTS/AU/Slice-able.component/Contents/MacOS/Slice-able" \
            "$ARTEFACTS/Standalone/Slice-able.app/Contents/MacOS/Slice-able"
          do
            archs="$(lipo -archs "$bin")"
            echo "$bin: $archs"
            if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
              echo "::error::$bin is not a universal binary"
              exit 1
            fi
          done

      # Apple Silicon refuses to load unsigned code. "--sign -" is an ad-hoc
      # signature: enough to run, but not notarised (users must clear the
      # quarantine flag on downloads; see the README).
      - name: Ad-hoc code sign
        run: |
          set -euo pipefail
          for bundle in VST3/Slice-able.vst3 AU/Slice-able.component Standalone/Slice-able.app; do
            codesign --force --deep --sign - "$ARTEFACTS/$bundle"
            codesign --verify --deep --strict "$ARTEFACTS/$bundle"
          done

      # Install the AU where macOS looks for it, make the system rescan
      # (killall AudioComponentRegistrar), then validate it by its type/codes.
      - name: Validate AU (auval)
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/Slice-able.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Slcb Dlio

      - name: Validate VST3 (pluginval)
        run: |
          set -euo pipefail
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          pluginval/pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --validate "$ARTEFACTS/VST3/Slice-able.vst3"

      # Plug-ins on macOS are folders ("bundles"); zip each one so it downloads intact.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto keeps bundle permissions and symlinks intact
          ditto -c -k --keepParent "$ARTEFACTS/VST3/Slice-able.vst3"        dist/Slice-able-macOS-VST3.zip
          ditto -c -k --keepParent "$ARTEFACTS/AU/Slice-able.component"     dist/Slice-able-macOS-AU.zip
          ditto -c -k --keepParent "$ARTEFACTS/Standalone/Slice-able.app"   dist/Slice-able-macOS-Standalone.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Slice-able-macOS-Universal
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # No generator given: CMake picks the newest installed Visual Studio.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # pluginval.exe is a GUI-type program, so Start-Process -Wait is used to
      # wait for it to finish and collect its exit code (0 = passed).
      - name: Validate VST3 (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pvArgs = @('--strictness-level', '10', '--validate-in-process', '--output-dir', 'pluginval-logs',
                    '--validate', "$env:ARTEFACTS/VST3/Slice-able.vst3")
          $p = Start-Process -FilePath pluginval\pluginval.exe -ArgumentList $pvArgs -NoNewWindow -Wait -PassThru
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          exit $p.ExitCode

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:ARTEFACTS/VST3/Slice-able.vst3" -DestinationPath dist/Slice-able-Windows-VST3.zip
          Compress-Archive -Path "$env:ARTEFACTS/Standalone/Slice-able.exe" -DestinationPath dist/Slice-able-Windows-Standalone.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Slice-able-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
